# Wisp config. Changes apply the next time the launcher opens.

# Shortcut to show or hide the launcher.
# Examples: "Alt+Space", "Ctrl+Shift+Space", "Win+Alt+R", "Ctrl+F12"
hotkey = "Alt+Space"

# Global shortcut to quit Wisp and restore the Windows taskbar.
quit_hotkey = "Ctrl+Win+Alt+X"

# Pause Wisp and restore the Windows taskbar during Remote Desktop.
pause_on_rdp = true
automatic_updates = false

# Results visible at once. Scroll to see more.
max_results = 8

# "system", "dark" or "light"
theme = "system"

# Shared material: "acrylic" (Frosted), "glass", "solid", or a legacy material
backdrop = "acrylic"
# Optional Transparent/Glass overrides: 0 = opaque, 100 = clear background
# backdrop_transparency = 85
# backdrop_blur = false
# When absent: Transparent = 85% without blur; Glass = 36% with blur

# Where the launcher opens: "bottom" for a search box at the bottom of the
# screen with results above it, where the dock grows into the launcher; or
# "center".
position = "bottom"

# Wisp Start placement, independent of the compact launcher: "bottom" or "center".
start_position = "bottom"

# Show recently launched apps when the search box is empty.
show_recent = true

# Search file names in the Windows Search index. Start a query with ? to
# search files only.
file_search = true

# Folder names that file search skips. It always skips files and folders
# whose names start with a dot, such as .git.
file_search_exclude = ["node_modules", "AppData", "site-packages", "__pycache__", "venv", "target", "dist", "build", "Cache", "Code Cache", "GPUCache", "Service Worker", "IndexedDB", "Extensions"]

# Hide the Windows taskbar while Wisp runs. The taskbar comes back when Wisp
# quits.
hide_taskbar = true

# Show the dock: running apps, notification icons, volume, battery and the
# clock. It appears when the pointer touches the bottom edge of a screen.
dock = true

# Dock-only background. "shared-material" follows the shared backdrop.
dock_background = "shared-material"
# Optional dock gradient settings. The values below are the defaults.
# dock_gradient = { start = "#202943", end = "#382B45", direction = "left-to-right", transparency = 15 }
# Directions: left-to-right, top-to-bottom, diagonal. Transparency: 0 opaque, 100 clear.

# Hide the dock until the pointer touches the bottom edge of a screen. With
# false, the dock stays on the main screen and windows stop above it while the
# taskbar is hidden.
dock_autohide = true
# Full-width bottom activation strip, in physical pixels (1–128).
dock_reveal_height = 8
# With auto-hide enabled, keep visible outside focused maximized/fullscreen apps.
# Maximized apps allow bottom-strip reveal; fullscreen stays suppressed.
# Restored/background windows do not hide it; false keeps pointer auto-hide.
dock_smart_hide = false
dock_current_monitor_only = false
dock_preview_current_monitor_only = false
# App window list shown when hovering a running app icon:
# "multiple" (only when the app has multiple windows), "always", or "off".
window_list = "always"

# App icons in the dock, in DIPs (24 to 40). The default is 24.
dock_icon_size = 24

# Auto-hide animation duration in milliseconds. Use 0 for instant.
dock_open_ms = 180
dock_close_ms = 140
# slide, fade, rise-fade, scale-fade, soft-rise, bottom-reveal, or soft-scale.
dock_animation = "slide"

# Open Wisp Start with a bare Windows key tap.
win_start = true
music_notch = false
# Hide media from complete source app IDs or display names (case insensitive).
music_excluded_apps = []
# Optional top bar. Heights use Windows-scaled pixels (DIP), 24 to 48.
topbar = false
topbar_height = 32
# Background opacity, 0 to 100. Icons retain their contrast.
topbar_opacity = 0
topbar_island_opacity = 70
# Optional Windows 11 native glass, only behind the island.
topbar_island_blur = false
# ["primary"], ["all"], or selected Windows display names such as \\.\DISPLAY2.
topbar_monitors = ["primary"]
# Used by the Color backdrop (RGB hex).
backdrop_color = "#252833"
